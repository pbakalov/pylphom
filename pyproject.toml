[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pylphom"
version = "0.1.0"
description = "Python implementation of lphom ecological inference algorithms for vote transfer estimation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["pylphom"]
